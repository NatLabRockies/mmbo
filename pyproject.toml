[build-system]
requires = [
	"setuptools>=64.0",
    "setuptools-scm>=8.0",
]
build-backend = "setuptools.build_meta"

[tool-setuptools]
include-package-data = true

[project]
name = "mmbo"
version = "1.0.0"
dependencies = [
	"numpy",
	"pandas",
	"pyro-ppl",
	"scikit-learn",
	"scipy",
	"torch",
	"torch_pca"
]
authors = [
	{name="Ian Taylor", email="ian.taylor@nlr.gov"},
]
description = "Multimodal Bayesian Optimization"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
]

[project.optional-dependencies]
notebooks = [
	"ipykernel",
	"ipywidgets",
	"matplotlib",
	"numpyro",
	"seaborn",
]

[project.urls]
Homepage = "https://github.com/NatLabRockies/mmbo"
